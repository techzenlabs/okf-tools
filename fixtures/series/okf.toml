# A synthetic bundle for the two set-shaped warnings: a number shared inside
# one series (§4.2) and two files holding the same bytes (§5.1). Both are
# questions about a group of files rather than about one, which is why neither
# could be answered inside the per-file walk and why both need a bundle to
# themselves rather than a page.
#
# Every name here is invented. The shapes are real: `plans/` holding work
# items over an `archive/` of execution plans is the ratified merge whose
# arithmetic a tree-only check would report as a defect, and it is in this
# fixture to be reported as clean.
config_version = 1
okf_version = "0.2"
bundle_root = "."
title = "Series fixture"
description = "One shared number per series, and one duplicated file."
max_warnings = 1000

[vocabulary]
extends = ["core", "engineering"]

# `evidence/`, `release/` and `packs/` were added after both set-shaped
# warnings fired on correct content in the estate. `evidence/` holds two files
# dated one day and `release/` two release notes a day apart — §4.3's two dated
# forms, read as series numbers `20260708` and `2026` by the first version of
# the §4.2 check. `packs/one` and `packs/two` hold the output of an execution
# scaffold: byte-identical `artifacts/notes.md` and `artifacts/index.md`, which
# is what seventy-seven packs of `gill-logistics/reporting-system` look like.
# All three are here to be reported as clean, and the 0016, 0025 and
# `notes/` pairs above are here to keep firing.
